<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6ea0c4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Tarif &amp; Sonia — Save the Date</title>
    <meta
      name="description"
      content="Save the date for Tarif and Sonia. October 31, 2026."
    />
    <meta property="og:title" content="Tarif & Sonia — Save the Date" />
    <meta property="og:description" content="October 31, 2026" />
    <meta property="og:image" content="/cover.jpg" />
    <link rel="preload" as="image" href="/cover.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="hero">
      <img
        class="hero-photo"
        src="/cover.jpg"
        alt="Tarif proposing to Sonia by a mountain lake in Banff"
        width="1024"
        height="682"
        fetchpriority="high"
        decoding="async"
      />
      <canvas id="scene" aria-hidden="true"></canvas>
      <div class="vignette" aria-hidden="true"></div>
    </header>
    <section class="intro" aria-label="Save the date">
      <div class="veil">
        <p class="eyebrow">Save the Date</p>
        <h1>Tarif <em>&amp;</em> Sonia</h1>
        <div class="rule" aria-hidden="true"></div>
        <p class="date">October 31, 2026</p>
        <p class="note">A Saturday evening · Invitation to follow</p>
      </div>
    </section>

    <main>
      <section class="story" aria-label="Engagement photos">
        <p class="story-kicker">Our Story</p>
        <div class="gallery" id="gallery"></div>
      </section>

      <section class="finale" aria-label="Closing photograph">
        <img
          id="finale-photo"
          alt="Tarif and Sonia running through a Banff meadow"
          width="682"
          height="1024"
          loading="lazy"
          decoding="async"
        />
        <div class="finale-copy">
          <p>October 31, 2026</p>
          <p class="finale-names">Tarif &amp; Sonia</p>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
