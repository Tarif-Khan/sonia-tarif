<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6ea0c4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Tarif &amp; Sonia — Save the Date</title>
    <meta
      name="description"
      content="Save the date for Tarif and Sonia. October 31, 2026."
    />
    <meta property="og:title" content="Tarif & Sonia — Save the Date" />
    <meta property="og:description" content="October 31, 2026" />
    <meta property="og:image" content="/cover.jpg" />
    <link rel="preload" as="image" href="/cover.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="gate" id="gate">
      <div class="gate-inner">
        <p class="eyebrow">Tarif &amp; Sonia</p>
        <div class="rule" aria-hidden="true"></div>
        <h1 class="gate-title">Please enter the<br />password</h1>
        <form id="gate-form" autocomplete="off" novalidate>
          <input
            id="gate-password"
            type="password"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="16"
            autocomplete="off"
            aria-label="Password"
          />
          <button type="submit" id="gate-submit">Enter</button>
          <p class="gate-error" id="gate-error" hidden>That isn't it — please try again.</p>
        </form>
      </div>
    </div>

    <div id="site" hidden>
      <header class="hero">
      <img
        class="hero-photo"
        src="/cover.jpg"
        alt="Tarif proposing to Sonia by a mountain lake in Banff"
        width="1024"
        height="682"
        fetchpriority="high"
        decoding="async"
      />
      <canvas id="scene" aria-hidden="true"></canvas>
      <div class="vignette" aria-hidden="true"></div>
    </header>
    <section class="intro" aria-label="Save the date">
      <div class="veil">
        <p class="eyebrow">Save the Date</p>
        <h1>Tarif <em>&amp;</em> Sonia</h1>
        <div class="rule" aria-hidden="true"></div>
        <p class="date">October 31, 2026</p>
        <p class="note">A Saturday evening celebration</p>
      </div>
    </section>

    <main>
      <section class="story" aria-label="Photos">
        <p class="story-kicker">Photos</p>
        <div class="tabs" role="tablist" aria-label="Photo collections">
          <button
            type="button"
            class="tab is-active"
            id="tab-engagement"
            role="tab"
            aria-selected="true"
            aria-controls="gallery"
          >Engagement</button>
          <button
            type="button"
            class="tab"
            id="tab-story"
            role="tab"
            aria-selected="false"
            aria-controls="timeline"
          >Our Story</button>
        </div>
        <div class="gallery" id="gallery" role="tabpanel" aria-labelledby="tab-engagement"></div>
        <div class="timeline" id="timeline" role="tabpanel" aria-labelledby="tab-story" hidden></div>
      </section>

      <section class="finale" aria-label="Closing photograph">
        <img
          id="finale-photo"
          alt="Tarif and Sonia running through a Banff meadow"
          width="682"
          height="1024"
          loading="lazy"
          decoding="async"
        />
        <div class="finale-copy">
          <p>October 31, 2026</p>
          <p class="finale-names">Tarif &amp; Sonia</p>
        </div>
      </section>
    </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
